<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bharat Enterprise — Free billing & inventory platform for Indian pharma distributors. GST invoicing, stock tracking & credit management." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#09090b" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bharat-enterprise-theme');
          var isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'system') {
            isDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? '#09090b' : '#f8fafc');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="canonical" href="%VITE_FRONTEND_URL%/" />
    <!-- Open Graph -->
    <meta property="og:title" content="Bharat Enterprise — Free Billing & Inventory Platform" />
    <meta property="og:description" content="GST-compliant invoicing, real-time inventory, and customer credit tracking — all in one place. Completely free, forever." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_FRONTEND_URL%/" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bharat Enterprise — Free Billing & Inventory Platform" />
    <meta name="twitter:description" content="GST-compliant invoicing, real-time inventory, and customer credit tracking — all in one place." />
    <title>Bharat Enterprise — Free Billing & Inventory Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Organization JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bharat Enterprise",
      "url": "%VITE_FRONTEND_URL%",
      "description": "Free billing and inventory management platform for Indian pharmaceutical distributors.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      }
    }
    </script>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #09090b;
        color: #f8fafc;
      }
      html.light, html.light body, html.light #root {
        background-color: #f8fafc;
        color: #0f172a;
      }
      html.dark, html.dark body, html.dark #root {
        background-color: #09090b;
        color: #f8fafc;
      }
      #prerender {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background-color: inherit;
      }
      .prerender-spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        border: 3px solid #2a2b32;
        border-top-color: #3b82f6;
      }
      html.light .prerender-spinner {
        border-color: #cbd5e1;
        border-top-color: #2563eb;
      }
      .prerender-text {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        margin: 0;
        color: #a1a1aa;
      }
      html.light .prerender-text {
        color: #475569;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Pre-render placeholder for FCP — replaced by React on mount -->
      <div id="prerender">
        <div class="prerender-spinner"></div>
        <p class="prerender-text">Loading Bharat Enterprise...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
