<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Professional billing, multi-batch inventory, customer ledgers and GST-ready invoicing for Indian distributors, wholesalers and retail enterprises." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#09090b" />
    <script>
      (function () {
        try {
          var path = window.location.pathname;
          var isAuthRoute = path === '/login' || path === '/register' || path.indexOf('/login') === 0 || path.indexOf('/register') === 0;
          var isPublic = path === '/' || path === '/landing' || isAuthRoute || path === '/privacy-policy' || path === '/terms' || path.indexOf('/forgot-password') === 0 || path.indexOf('/reset-password') === 0;
          var systemDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = true;

          var landingSaved = localStorage.getItem('bharat-enterprise-landing-theme');
          var appSaved = localStorage.getItem('bharat-enterprise-theme');
          var activePref = isPublic ? (landingSaved || appSaved) : (appSaved || landingSaved);

          if (activePref === 'light') {
            isDark = false;
          } else if (activePref === 'dark') {
            isDark = true;
          } else if (activePref === 'system') {
            isDark = systemDark;
          } else {
            // Default: Auth routes and workspace default to dark, unconfigured marketing defaults to system preference
            isDark = isAuthRoute ? true : (isPublic ? systemDark : true);
          }

          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? '#09090b' : '#f1f5f9');
          }
        } catch (e) {}
      })();
    </script>
    <link id="canonical-tag" rel="canonical" href="%VITE_FRONTEND_URL%/" />
    <script>
      (function () {
        try {
          var canonical = document.getElementById('canonical-tag');
          if (canonical) {
            var origin = window.location.origin;
            var pathname = window.location.pathname;
            var cleanPath = pathname === '/' ? '' : pathname.replace(/\/+$/, '');
            canonical.setAttribute('href', origin + cleanPath);
          }
        } catch (e) {}
      })();
    </script>
    <!-- Open Graph -->
    <meta property="og:title" content="Bharat Enterprise — Billing, Inventory & GST-Ready Invoicing" />
    <meta property="og:description" content="Professional billing, multi-batch inventory, customer ledgers and GST-ready invoicing for Indian distributors, wholesalers and retail enterprises." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_FRONTEND_URL%/" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bharat Enterprise — Billing, Inventory & GST-Ready Invoicing" />
    <meta name="twitter:description" content="Professional billing, multi-batch inventory, customer ledgers and GST-ready invoicing for Indian distributors, wholesalers and retail enterprises." />
    <title>Bharat Enterprise — Billing, Inventory & GST-Ready Invoicing</title>
    <!-- Optimized Preconnects & High-Priority Hero WebP Preloads -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preload" as="image" href="/landing/product/dashboard-v2-mobile.webp" type="image/webp" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/landing/product/dashboard-v2.webp" type="image/webp" media="(min-width: 769px)" fetchpriority="high" />
    <!-- Asynchronous Non-Blocking Google Fonts Loading -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    </noscript>
    <!-- Organization JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Bharat Enterprise",
      "url": "%VITE_FRONTEND_URL%",
      "description": "Billing, multi-batch inventory tracking, and customer khata ledger suite for Indian distributors and enterprises.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web"
    }
    </script>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        height: auto;
        background-color: #09090b;
        color: #f8fafc;
      }
      html.light, html.light body, html.light #root {
        background-color: #f8fafc;
        color: #0f172a;
      }
      html.dark, html.dark body, html.dark #root {
        background-color: #09090b;
        color: #f8fafc;
      }
      #prerender {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background-color: inherit;
      }
      .prerender-spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        border: 3px solid #2a2b32;
        border-top-color: #3b82f6;
      }
      html.light .prerender-spinner {
        border-color: #cbd5e1;
        border-top-color: #2563eb;
      }
      .prerender-text {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        margin: 0;
        color: #a1a1aa;
      }
      html.light .prerender-text {
        color: #475569;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Pre-render placeholder for FCP — replaced by React on mount -->
      <div id="prerender">
        <div class="prerender-spinner"></div>
        <p class="prerender-text">Loading Bharat Enterprise...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
